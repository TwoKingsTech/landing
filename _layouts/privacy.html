---
layout: default
---
<div class="privacy">
  <div class="privacy__back">
    <a href="{{ page.app_url | relative_url }}">&larr; Back to {{ page.app_name }}</a>
  </div>
  <h1>{{ page.title }}</h1>
  <p class="privacy__date">Last updated: {{ page.updated }}</p>
  <div class="privacy__body">
    {{ content }}
  </div>
</div>
